<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Forge</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="icon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="theme-color" content="#040b1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forge">
<link rel="manifest" href="manifest.json">
<style>
  /* Palette sampled directly from the Forge app icon: deep navy-black
     ground, molten orange flame, steel-blue anvil. */
  :root {
    --bg: #040b1b;          /* icon background, 35% of its pixels */
    --bg-deep: #03091a;     /* darkest corner */
    --card: #111e34;        /* anvil body, lit side */
    --card-raise: #16243d;  /* insets: icon tiles, inputs, buttons */
    --card-border: #1e3050;
    --text: #eef2fa;
    --muted: #8a97b5;
    --accent: #fd7400;      /* flame, mid orange */
    --accent-hot: #ff9809;  /* flame, bright */
    --accent-core: #fde039; /* flame, hottest core */
    --ember: #562312;       /* glow behind the flame */
    --on-accent: #04101f;   /* text sitting on an orange fill */
    --accent-glow: rgba(253, 116, 0, 0.4);
    --good: #3ddc84;
    --bad: #ff5c5c;
    --bad-soft: #ff9a86;
  }
  * { box-sizing: border-box; }

  /* The html element had no background, so the browser's default white
     showed through at the top of the screen -- in the safe area above the
     page on a phone, and whenever the page rubber-bands past its edge.
     body alone isn't enough: it only paints its own box. */
  html {
    background: var(--bg-deep);
    color-scheme: dark;   /* keeps scrollbars and overscroll dark too */
  }

  /* ---- Atmosphere: forge glow + drifting embers ---- */
  /* Real forge photo behind everything. Measured brightness per band:
     the coals along the bottom peak at 249/255, so they get a much
     heavier scrim than the already-dark middle, otherwise the chore
     tiles and tab bar sit on glare. */
  .forge-bg {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    background-image:
      /* Light 0.30 scrim so the forge actually reads. Measured: no text
         colour can clear 4.5:1 over this photo's highlights by dimming
         alone (white tops out at 3.46 even at 0.50), so readability is
         handled by backing the few labels that sit on the backdrop --
         see .backdrop-label -- not by flattening the picture. */
      linear-gradient(rgba(4, 11, 27, 0.30), rgba(4, 11, 27, 0.30)),
      url("forge-bg.jpg");
    background-size: cover, cover;
    background-position: center, center bottom;
    background-repeat: no-repeat;
  }
  @media (max-width: 700px) {
    /* smaller file on phones: 36KB instead of 86KB */
    .forge-bg {
      background-image:
        linear-gradient(rgba(4, 11, 27, 0.30), rgba(4, 11, 27, 0.30)),
        url("forge-bg-small.jpg");
      background-size: cover, cover;
      background-position: center, center bottom;
    }
  }
  /* slow pulse, like a fire breathing */
  /* the coals in the photo are static, so breathe a warm light over them */
  .forge-bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 110% 30% at 50% 103%, rgba(255, 152, 9, 0.26) 0%, transparent 66%);
    mix-blend-mode: screen;
    animation: breathe 7s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.35; transform: scaleY(0.94); }
    50%      { opacity: 0.85; transform: scaleY(1.06); }
  }

  .embers {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }
  .embers span {
    position: absolute;
    bottom: -14px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent-hot);
    box-shadow: 0 0 7px 2px rgba(253, 116, 0, 0.75);
    opacity: 0;
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { opacity: 0; transform: translate3d(0, 0, 0) scale(0.5); }
    8%   { opacity: 1; }
    70%  { opacity: 0.85; }
    100% { opacity: 0; transform: translate3d(var(--drift, 22px), -102vh, 0) scale(1.15); }
  }
  /* each ember gets its own lane, speed, size and drift */
  .embers span:nth-child(1)  { left:  4%; animation-duration: 15s; animation-delay: 0s;    --drift:  34px; }
  .embers span:nth-child(2)  { left: 11%; animation-duration: 20s; animation-delay: 2.4s;  --drift: -26px; width: 3px; height: 3px; }
  .embers span:nth-child(3)  { left: 18%; animation-duration: 13s; animation-delay: 5.1s;  --drift:  18px; }
  .embers span:nth-child(4)  { left: 25%; animation-duration: 23s; animation-delay: 1.2s;  --drift: -40px; width: 5px; height: 5px; }
  .embers span:nth-child(5)  { left: 31%; animation-duration: 17s; animation-delay: 7.6s;  --drift:  28px; }
  .embers span:nth-child(6)  { left: 38%; animation-duration: 12s; animation-delay: 3.3s;  --drift: -14px; width: 3px; height: 3px; }
  .embers span:nth-child(7)  { left: 44%; animation-duration: 21s; animation-delay: 9.8s;  --drift:  44px; }
  .embers span:nth-child(8)  { left: 50%; animation-duration: 16s; animation-delay: 0.8s;  --drift: -30px; }
  .embers span:nth-child(9)  { left: 56%; animation-duration: 25s; animation-delay: 6.2s;  --drift:  22px; width: 5px; height: 5px; }
  .embers span:nth-child(10) { left: 62%; animation-duration: 14s; animation-delay: 11.4s; --drift: -36px; width: 3px; height: 3px; }
  .embers span:nth-child(11) { left: 69%; animation-duration: 19s; animation-delay: 4.5s;  --drift:  16px; }
  .embers span:nth-child(12) { left: 75%; animation-duration: 22s; animation-delay: 8.7s;  --drift: -22px; }
  .embers span:nth-child(13) { left: 81%; animation-duration: 15s; animation-delay: 13.1s; --drift:  38px; width: 3px; height: 3px; }
  .embers span:nth-child(14) { left: 87%; animation-duration: 18s; animation-delay: 2.9s;  --drift: -18px; }
  .embers span:nth-child(15) { left: 93%; animation-duration: 24s; animation-delay: 10.3s; --drift:  26px; width: 5px; height: 5px; }
  .embers span:nth-child(16) { left: 97%; animation-duration: 13s; animation-delay: 6.9s;  --drift: -28px; }
  .embers span:nth-child(17) { left: 66%; animation-duration: 27s; animation-delay: 15.2s; --drift:  12px; width: 3px; height: 3px; }
  .embers span:nth-child(18) { left: 22%; animation-duration: 26s; animation-delay: 12.6s; --drift: -44px; }

  /* Anyone who gets motion sick, or a device saving battery, sees it still. */
  @media (prefers-reduced-motion: reduce) {
    .embers { display: none; }
    .forge-bg::after { animation: none; opacity: 0.55; }
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(ellipse 70% 40% at 50% 0%, var(--ember) 0%, transparent 70%),
      radial-gradient(circle at top, #0a1428 0%, var(--bg) 55%, var(--bg-deep) 100%);
    background-attachment: fixed;
    background-color: var(--bg-deep);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;   /* dvh accounts for the phone's address bar */
    /* clear the notch / status bar rather than sliding under it */
    padding: calc(24px + env(safe-area-inset-top, 0px))
             calc(16px + env(safe-area-inset-right, 0px))
             60px
             calc(16px + env(safe-area-inset-left, 0px));
  }
  header {
    text-align: center;
    margin-bottom: 28px;
  }
  header h1 {
    font-size: 2.2rem;
    margin: 0;
    letter-spacing: 1px;
    background: linear-gradient(100deg,
      var(--accent) 0%, var(--accent-core) 25%, #fff3c4 40%,
      var(--accent-core) 55%, var(--accent) 80%, var(--accent) 100%);
    background-size: 280% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 6s ease-in-out infinite;
    filter: drop-shadow(0 0 14px rgba(253, 116, 0, 0.35));
  }
  @keyframes shimmer {
    0%, 100% { background-position: 100% 50%; }
    50%      { background-position: 0% 50%; }
  }
  header p {
    color: var(--muted);
    margin: 6px 0 0;
    font-size: 0.95rem;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
  }

  /* ---- Habits board (Skylight-style day view) ---- */
  #tab-habits.active {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
  }
  .day-header {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: 18px;
    background:
      linear-gradient(135deg, rgba(253, 116, 0, 0.10) 0%, transparent 45%),
      var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 18px 22px;
    margin-bottom: 22px;
    box-shadow: 0 4px 22px rgba(0, 0, 0, 0.4);
  }
  .day-info { flex: 1; min-width: 0; }
  .day-date {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  .day-progress-text {
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: 3px;
  }
  .day-ring-wrap {
    position: relative;
    width: 56px;
    height: 56px;
    flex-shrink: 0;
  }
  .day-ring { width: 56px; height: 56px; }
  #dayRingFill {
    transition: stroke-dashoffset 0.45s cubic-bezier(0.34, 1.3, 0.64, 1);
    filter: drop-shadow(0 0 5px rgba(61, 220, 132, 0.75));
  }
  .day-ring-pct {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    font-weight: 700;
  }
  .edit-toggle {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--muted);
    border-radius: 999px;
    padding: 9px 18px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  .edit-toggle.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
  }
  .board {
    display: grid;
    grid-template-columns: 1fr;
    gap: 22px;
  }
  @media (min-width: 820px) {
    .board { grid-template-columns: 1fr 1fr; align-items: start; }
  }
  /* Anything sitting straight on the photo gets its own dark backing, so
     its contrast is against this chip (verified 8.7:1) rather than
     against whatever happens to be behind it. */
  .backdrop-label {
    display: inline-block;
    background: rgba(4, 11, 27, 0.85);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(253, 116, 0, 0.18);
    border-radius: 999px;
    padding: 6px 14px;
    color: var(--text);
  }
  .col-title {
    margin: 0 0 12px;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.7px;
  }
  header p#tagline {
    display: inline-block;
    background: rgba(4, 11, 27, 0.8);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 999px;
    padding: 5px 16px;
    color: var(--text);
  }
  .add-tile {
    width: 100%;
    background: transparent;
    border: 2px dashed var(--card-border);
    color: var(--muted);
    padding: 16px;
    border-radius: 16px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 600;
  }
  .add-tile:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .habit-card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-left: 6px solid var(--tile, var(--accent));
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: border-color 0.2s, opacity 0.2s;
  }
  .habit-card {
    box-shadow: 0 2px 14px rgba(0, 0, 0, 0.35);
  }
  .habit-card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(100deg, var(--tile, var(--accent)) 0%, transparent 42%);
    opacity: 0.07;
  }
  .habit-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 26px rgba(0, 0, 0, 0.45),
                0 0 0 1px color-mix(in srgb, var(--tile, var(--accent)) 35%, transparent);
  }
  .habit-card.done {
    border-color: var(--good);
    border-left-color: var(--good);
  }
  .habit-card.done::after { opacity: 0.03; }
  .remove-btn {
    position: absolute;
    top: -9px;
    right: -9px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid var(--on-accent);
    background: var(--bad);
    color: var(--on-accent);
    font-size: 1rem;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .remove-btn:active { transform: scale(0.9); }
  .habit-icon {
    font-size: 2rem;
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--card-raise);
    border-radius: 12px;
    flex-shrink: 0;
  }
  .habit-info {
    flex: 1;
    min-width: 0;
  }
  .habit-info h2 {
    margin: 0 0 2px;
    font-size: 1.1rem;
  }
  .habit-stats {
    display: flex;
    gap: 14px;
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 4px;
    flex-wrap: wrap;
  }
  .habit-stats span b {
    color: var(--text);
  }
  .check-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 2px solid var(--card-border);
    background: transparent;
    color: var(--muted);
    font-size: 1.3rem;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .check-btn.checked {
    background: var(--good);
    border-color: var(--good);
    color: var(--on-accent);
    box-shadow: 0 0 14px rgba(61, 220, 132, 0.45);
    animation: pop 0.3s ease;
  }
  @keyframes pop {
    0%   { transform: scale(0.75); }
    55%  { transform: scale(1.14); }
    100% { transform: scale(1); }
  }
  .check-btn:active {
    transform: scale(0.9);
  }
  .streak-flame {
    color: var(--accent);
  }
  dialog {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 20px;
    max-width: 320px;
    width: 90%;
  }
  dialog::backdrop {
    background: rgba(0,0,0,0.6);
  }
  dialog input, dialog select {
    width: 100%;
    padding: 8px 10px;
    margin: 6px 0 12px;
    background: var(--card-raise);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.95rem;
  }
  .day-picker { margin-bottom: 10px; }
  .day-toggles {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }
  .day-toggle {
    flex: 1 0 auto;
    min-width: 44px;
    padding: 8px 6px;
    border-radius: 9px;
    border: 1px solid var(--card-border);
    background: var(--card-raise);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
  }
  .day-toggle.on {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
  }
  .dialog-hint {
    margin: 2px 0 12px;
    font-size: 0.76rem;
    color: var(--muted);
    min-height: 1.1em;
  }
  .habit-when {
    font-size: 0.74rem;
    color: var(--muted);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    padding: 2px 8px;
  }
  dialog label {
    font-size: 0.8rem;
    color: var(--muted);
  }
  .dialog-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }
  .dialog-actions button {
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .btn-cancel {
    background: transparent;
    color: var(--muted);
  }
  .btn-save {
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
  }
  /* sits straight on the photo, so it needs its own backing */
  .empty-state {
    text-align: center;
    padding: 34px 20px;
    color: var(--text);
    background: rgba(4, 11, 27, 0.82);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px dashed var(--card-border);
    border-radius: 16px;
  }

  /* Inline, no divider row, so a timed habit card is exactly as tall as a
     plain one. */
  .stopwatch-inline {
    display: inline-flex;
    align-items: center;
    gap: 9px;
  }
  .stopwatch-time {
    font-variant-numeric: tabular-nums;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text);
  }
  .stopwatch-time.running {
    color: var(--accent);
  }
  .sw-btn {
    border: none;
    border-radius: 7px;
    padding: 4px 12px;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
  }
  .sw-btn.start {
    background: var(--accent);
    color: var(--on-accent);
  }
  .sw-btn.stop {
    background: #3a1a12;
    color: var(--bad-soft);
    border: 1px solid var(--bad-soft);
  }

  .weekly-reports {
    margin-top: 24px;
  }
  .weekly-reports h3 {
    font-size: 0.95rem;
    color: var(--muted);
    margin: 0 0 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .report-row {
    display: flex;
    justify-content: space-between;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 0.88rem;
  }
  .report-row.latest {
    border-color: var(--good);
  }
  .report-row .label {
    color: var(--muted);
  }
  .report-row .value {
    font-weight: 600;
  }
  .task-card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-left: 6px solid var(--tile, var(--accent));
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .task-card.done {
    opacity: 0.65;
    border-color: var(--good);
    border-left-color: var(--good);
  }
  .task-card.late {
    border-color: var(--bad);
    border-left-color: var(--bad);
  }
  .task-main {
    flex: 1;
    min-width: 0;
  }
  .task-name {
    font-weight: 600;
    font-size: 1.02rem;
  }
  .task-meta {
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 3px;
  }
  .task-meta.late-text {
    color: var(--bad-soft);
  }
  .tabs {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 24px;
  }
  .tab-btn {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--muted);
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.88rem;
    font-weight: 600;
  }
  .tab-icon { margin-right: 5px; }

  .tab-btn {
    transition: color 0.18s, background 0.18s, border-color 0.18s, box-shadow 0.18s;
  }
  .tab-btn.active {
    background: linear-gradient(135deg, var(--accent-hot), var(--accent));
    border-color: var(--accent);
    color: var(--on-accent);
    box-shadow: 0 0 16px rgba(253, 116, 0, 0.45);
  }
  .tab-panel {
    display: none;
  }
  .tab-panel.active {
    display: block;
  }
  /* ---- Practice tabs (Sight Reading + Ear Training) ----
     Both break out of the narrow .wrap column and fill the viewport;
     they're practice modes, not list items. Everything below prefixed
     .practice- / .mode- / .note- is shared by both tabs. */
  #tab-sightread.active,
  #tab-ear.active {
    width: 100vw;
    max-width: 100vw;
    margin-left: calc(-50vw + 50%);
    margin-right: calc(-50vw + 50%);
    padding: 0 20px;
    min-height: calc(100vh - 40px);
    /* --tabbar is 0 on desktop, the bottom bar's height on phones */
    min-height: calc(100vh - 40px - var(--tabbar, 0px));
    display: flex;
    flex-direction: column;
  }
  .practice-card {
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(253, 116, 0, 0.09) 0%, transparent 70%),
      var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    box-shadow: 0 6px 30px rgba(0, 0, 0, 0.45);
    padding: 28px;
    text-align: center;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .practice-stats {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px 28px;

<script>
/* ---------- Data model ----------
  Each habit: { id, name, icon, log: { "YYYY-MM-DD": true, ... } }
  Stored in localStorage under "forge_habits_v1"
  Adding new habits later = just add to the defaults array or use the + button.
------------------------------------- */

const STORAGE_KEY = "forge_habits_v1";
const TASKS_KEY = "forge_tasks_v1";
// Default habits get topped up on load so new built-ins appear for existing
// users. That must not resurrect ones Kaius deliberately deleted, so we
// remember which defaults he removed.
const REMOVED_DEFAULTS_KEY = "forge_removed_defaults_v1";

const DEFAULT_HABITS = [
  { id: "bible", name: "Bible Reading", icon: "📖", log: {} },
  {
    id: "piano", name: "Piano Practice", icon: "🎹", log: {},
    trackTime: true,
    practice: { seconds: {}, sessionStart: null, history: [] },
  },
  { id: "math", name: "Math", icon: "➗", log: {} },
  { id: "reading", name: "Reading", icon: "📚", log: {} },
  { id: "science", name: "Science", icon: "🔬", log: {} },
];

const DEFAULT_TASKS = [
  { id: "make-bed", name: "Make bed", icon: "🛏️", repeat: "daily", dueTime: "09:00", done: {} },
  { id: "tidy-room", name: "Tidy room", icon: "🧹", repeat: "daily", dueTime: "", done: {} },
  { id: "trash", name: "Take trash out", icon: "🗑️", repeat: "weekly", dueTime: "18:00", done: {} },
];

function todayStr(offsetDays = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  return d.toISOString().slice(0, 10);
}

function dateKey(d) {
  return d.toISOString().slice(0, 10);
}

// Migrate old saved habits so new fields exist without wiping progress.
function migrateHabit(habit) {
  if (habit.trackTime && !habit.practice) {
    habit.practice = { seconds: {}, sessionStart: null, history: [] };
  }
  if (habit.practice) {
    if (!habit.practice.seconds) habit.practice.seconds = {};
    if (!habit.practice.history) habit.practice.history = [];
    if (habit.practice.sessionStart === undefined) habit.practice.sessionStart = null;
  }
  return habit;
}

function loadHabits() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return structuredClone(DEFAULT_HABITS);
  try {
    const parsed = JSON.parse(raw);
    // An empty array is a real state (everything deleted), not a missing save.
    if (Array.isArray(parsed)) {
      const migrated = parsed.map(migrateHabit);
      const removed = loadRemovedDefaults();
      DEFAULT_HABITS.forEach(defaultHabit => {
        const alreadyThere = migrated.some(h => h.id === defaultHabit.id);
        if (!alreadyThere && !removed.includes(defaultHabit.id)) {
          migrated.push(structuredClone(defaultHabit));
        }
      });
      return migrated;
    }
  } catch (e) {}
  return structuredClone(DEFAULT_HABITS);
}

function loadRemovedDefaults() {
  try {
    const raw = localStorage.getItem(REMOVED_DEFAULTS_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    return [];
  }
}

function rememberRemovedDefault(id) {
  if (!DEFAULT_HABITS.some(h => h.id === id)) return;
  const removed = loadRemovedDefaults();
  if (!removed.includes(id)) {
    removed.push(id);
    localStorage.setItem(REMOVED_DEFAULTS_KEY, JSON.stringify(removed));
  }
}

function saveHabits(habits) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
}

function loadTasks() {
  const raw = localStorage.getItem(TASKS_KEY);
  if (!raw) return structuredClone(DEFAULT_TASKS);
  try {
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed)) return parsed;
  } catch (e) {}
  return structuredClone(DEFAULT_TASKS);
}

function saveTasks(tasks) {
  localStorage.setItem(TASKS_KEY, JSON.stringify(tasks));
}

/* ---------- Scheduling ----------
  habit.schedule is one of:
    { kind: "daily" }                 every day
    { kind: "days", days: [1,3,5] }   only those weekdays (0 = Sunday)
    { kind: "weekly" }                once per week, any day
  Anything saved before scheduling existed is treated as daily.
----------------------------------- */

const DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

function scheduleOf(habit) {
  const s = habit.schedule;
  if (!s || !s.kind) return { kind: "daily" };
  if (s.kind === "days") {
    const days = Array.isArray(s.days) ? s.days.filter(d => d >= 0 && d <= 6) : [];
    // a "certain days" habit with no days picked would never be due
    return days.length ? { kind: "days", days } : { kind: "daily" };
  }
  if (s.kind === "weekly") return { kind: "weekly" };
  return { kind: "daily" };
}

// Is this habit due on the given date?
function dueOn(habit, date) {
  const s = scheduleOf(habit);
  if (s.kind === "daily") return true;
  if (s.kind === "days") return s.days.includes(date.getDay());
  return true; // weekly: due any day until it's done for the week
}

// A weekly habit counts as done for the whole week once ticked any day.
function doneForPeriod(habit, date) {
  const s = scheduleOf(habit);
  if (s.kind === "weekly") {
    return weekDates(startOfWeek(date)).some(k => habit.log[k]);
  }
  return !!habit.log[dateKey(date)];
}

// Shown on the board today? Weekly habits drop off once done for the week.
function showToday(habit) {
  const now = new Date();
  const s = scheduleOf(habit);
  if (s.kind === "weekly") return true;
  return dueOn(habit, now);
}

function scheduleLabel(habit) {
  const s = scheduleOf(habit);
  if (s.kind === "daily") return "Every day";
  if (s.kind === "weekly") return "Once a week";
  if (s.days.length === 7) return "Every day";
  const order = [1, 2, 3, 4, 5, 6, 0];
  const picked = order.filter(d => s.days.includes(d));
  if (picked.length === 5 && [1,2,3,4,5].every(d => s.days.includes(d))) return "Weekdays";
  if (picked.length === 2 && s.days.includes(0) && s.days.includes(6)) return "Weekends";
  return picked.map(d => DAY_NAMES[d]).join(" ");
}

/* ---------- Streaks ----------
  A streak counts consecutive DUE periods that were completed, so a
  Mon/Wed/Fri habit doesn't lose its streak on a Tuesday, and a weekly
  habit counts weeks rather than days.
----------------------------------- */

function calcStreak(log, habit) {
  const s = habit ? scheduleOf(habit) : { kind: "daily" };

  if (s.kind === "weekly") {
    let streak = 0;
    for (let w = 0; w < 520; w++) {
      const monday = startOfWeek(new Date());
      monday.setDate(monday.getDate() - w * 7);
      const done = weekDates(monday).some(k => log[k]);
      if (done) {
        streak++;
      } else if (w === 0) {
        continue;   // this week is still open, so it can't break the run
      } else {
        break;
      }
    }
    return streak;
  }

  let streak = 0;
  const cursor = new Date();
  for (let i = 0; i < 3650; i++) {
    const isDue = s.kind === "daily" || s.days.includes(cursor.getDay());
    if (isDue) {
      if (log[dateKey(cursor)]) streak++;
      else if (i === 0) { /* today still open, keep looking back */ }
      else break;
    }
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

function calcTotal(log) {
  return Object.values(log).filter(Boolean).length;
}

// Best run ever. Walks the due periods between the first tick and today,
// so gaps on days the habit was never due don't count against it.
function calcBest(log, habit) {
  const ticks = Object.keys(log).filter(d => log[d]).sort();
  if (!ticks.length) return 0;
  const s = habit ? scheduleOf(habit) : { kind: "daily" };

  if (s.kind === "weekly") {
    const weeks = [...new Set(ticks.map(d => dateKey(startOfWeek(new Date(d + "T00:00:00")))))].sort();
    let best = 1, run = 1;
    for (let i = 1; i < weeks.length; i++) {
      const gap = (new Date(weeks[i]) - new Date(weeks[i - 1])) / 604800000;
      run = gap === 1 ? run + 1 : 1;
      best = Math.max(best, run);
    }
    return Math.max(best, calcStreak(log, habit));
  }

  let best = 0, run = 0;
  const cursor = new Date(ticks[0] + "T00:00:00");
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  while (cursor <= today) {
    const isDue = s.kind === "daily" || s.days.includes(cursor.getDay());
    if (isDue) {
      if (log[dateKey(cursor)]) {
        run++;
        best = Math.max(best, run);
      } else if (dateKey(cursor) !== dateKey(today)) {
        run = 0;   // a missed due day breaks it, but today is still open
      }
    }
    cursor.setDate(cursor.getDate() + 1);
  }
  return Math.max(best, calcStreak(log, habit));
}

/* ---------- Stopwatch + weekly report helpers ---------- */

function formatHMS(totalSeconds) {
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = Math.floor(totalSeconds % 60);
  return [h, m, s].map(n => String(n).padStart(2, "0")).join(":");
}

function formatDuration(totalSeconds) {
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.round((totalSeconds % 3600) / 60);
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

function startOfWeek(date) {
  const d = new Date(date);
  const day = d.getDay(); // 0 Sun .. 6 Sat
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

function weekDates(monday) {
  const dates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(d.getDate() + i);
    dates.push(dateKey(d));
  }
  return dates;
}

function sumSecondsForWeek(secondsLog, monday) {
  return weekDates(monday).reduce((sum, key) => sum + (secondsLog[key] || 0), 0);
}

function currentSessionSeconds(habit) {
  if (!habit.practice || !habit.practice.sessionStart) return 0;
  return Math.floor((Date.now() - habit.practice.sessionStart) / 1000);
}

function liveTodaySeconds(habit) {
  const today = todayStr();
  const base = habit.practice.seconds[today] || 0;
  return base + currentSessionSeconds(habit);
}

function toggleStopwatch(id) {
  const habit = habits.find(h => h.id === id);
  if (!habit || !habit.trackTime) return;
  if (habit.practice.sessionStart) {
    // stop: commit elapsed seconds to today's log
    const elapsed = currentSessionSeconds(habit);
    const today = todayStr();
    habit.practice.seconds[today] = (habit.practice.seconds[today] || 0) + elapsed;
    habit.practice.sessionStart = null;
  } else {
    habit.practice.sessionStart = Date.now();
  }
  saveHabits(habits);
  archiveCompletedWeeks();
  render();
}

// A week's report unlocks once we're past Monday 6PM of the following week -
// that gives a grace window for a Monday-evening practice session to still
// count, then the previous Mon-Sun week gets locked in as a permanent report.
function archiveCompletedWeeks() {
  const now = new Date();
  const thisMonday = startOfWeek(now);
  const isMonday = now.getDay() === 1;
  const pastCutoff = !isMonday || now.getHours() >= 18;
  if (!pastCutoff) return;

  let changed = false;
  habits.forEach(habit => {
    if (!habit.trackTime || !habit.practice) return;
    const prevMonday = new Date(thisMonday);
    prevMonday.setDate(prevMonday.getDate() - 7);
    const weekKey = dateKey(prevMonday);
    const already = habit.practice.history.some(h => h.weekStart === weekKey);
    if (!already) {
      const total = sumSecondsForWeek(habit.practice.seconds, prevMonday);
      habit.practice.history.unshift({ weekStart: weekKey, seconds: total });
      habit.practice.history = habit.practice.history.slice(0, 12);
      changed = true;
    }
  });
  if (changed) saveHabits(habits);
}

// Sits inline in the stats row so a timed habit is the same height as a
// plain one. The week's total lives only in the Week of... reports below.
function renderStopwatchRow(habit) {
  const running = !!habit.practice.sessionStart;
  const todaySec = liveTodaySeconds(habit);
  return `
    <span class="stopwatch-inline">
      <span class="stopwatch-time ${running ? "running" : ""}" id="sw-time-${habit.id}">${formatHMS(todaySec)}</span>
      <button class="sw-btn ${running ? "stop" : "start"}" data-sw-id="${habit.id}">${running ? "Stop" : "Start"}</button>
    </span>
  `;
}

function renderWeeklyReports() {
  const box = document.getElementById("weeklyReports");
  const trackedHabits = habits.filter(h => h.trackTime && h.practice && h.practice.history.length);
  if (!trackedHabits.length) {
    box.innerHTML = "";
    return;
  }
  let html = "";
  trackedHabits.forEach(habit => {
    html += `<div class="weekly-reports"><h3 class="backdrop-label">${escapeHtml(habit.name)} — Weekly Reports</h3>`;
    habit.practice.history.forEach((entry, i) => {
      const start = new Date(entry.weekStart + "T00:00:00");
      const label = start.toLocaleDateString(undefined, { month: "short", day: "numeric" });
      html += `<div class="report-row ${i === 0 ? "latest" : ""}">
        <span class="label">Week of ${label}</span>
        <span class="value">${formatDuration(entry.seconds)}</span>
      </div>`;
    });
    html += `</div>`;
  });
  box.innerHTML = html;
}

function periodKeyForTask(task) {
  if (task.repeat === "weekly") return dateKey(startOfWeek(new Date()));
  if (task.repeat === "once") return "once";
  return todayStr();
}

function taskIsLate(task) {
  if (!task.dueTime || task.done[periodKeyForTask(task)]) return false;
  const now = new Date();
  if (task.repeat === "weekly") {
    const weekEnd = startOfWeek(now);
    weekEnd.setDate(weekEnd.getDate() + 6);
    const [h, m] = task.dueTime.split(":").map(Number);
    weekEnd.setHours(h, m, 0, 0);
    return now > weekEnd;
  }
  const [h, m] = task.dueTime.split(":").map(Number);
  const due = new Date();
  due.setHours(h, m, 0, 0);
  return now > due;
}

function repeatLabel(task) {
  if (task.repeat === "daily") return task.dueTime ? `Daily by ${task.dueTime}` : "Daily";
  if (task.repeat === "weekly") return task.dueTime ? `Weekly by Sunday ${task.dueTime}` : "Weekly";
  return task.dueTime ? `One time by ${task.dueTime}` : "One time";
}

  const streak = calcStreak(habit.log, habit);
  const unit = scheduleOf(habit).kind === "weekly" ? "week" : "day";
  const warn = streak > 0
    ? `Remove "${habit.name}"? You'd lose a ${streak} ${unit} streak.`
    : `Remove "${habit.name}"?`;

function toggleToday(id) {
  const habit = habits.find(h => h.id === id);
  if (!habit) return;
  const today = todayStr();

  // A weekly habit may have been ticked on a different day this week;
  // unchecking should clear that tick, not just today's.
  if (scheduleOf(habit).kind === "weekly" && !habit.log[today]) {
    const thisWeek = weekDates(startOfWeek(new Date()));
    const existing = thisWeek.find(k => habit.log[k]);
    if (existing) {
      delete habit.log[existing];
      saveHabits(habits);
      render();
      return;
    }
  }

  if (habit.log[today]) {
    delete habit.log[today];
  } else {
    habit.log[today] = true;
  }
  saveHabits(habits);
  render();
}

/* ---------- Sight Reading flashcards ---------- */

const SR_KEY = "forge_sightread_v1";
const LETTER_ORDER = ["C", "D", "E", "F", "G", "A", "B"];
const NOTE_LETTERS = ["A", "B", "C", "D", "E", "F", "G"];

let srSessionStart = null;

// Every mode is a timed perfect run over EVERY note in that mode's range,
// each note exactly once, shuffled. One mistake reshuffles and restarts.
// Finishing records your best time for that mode.
let runDeck = [];
let runIndex = 0;
let runStart = null;

function formatClock(secs) {
  const m = Math.floor(secs / 60);
  const s = Math.floor(secs % 60);
  return `${m}:${String(s).padStart(2, "0")}`;
}

function updateSRTimer() {
  const el = document.getElementById("srTimer");
  if (!el) return;
  const secs = runStart ? (Date.now() - runStart) / 1000 : 0;
  el.textContent = formatClock(secs);
}

/* Shared by both practice tabs: build the list of every natural note in a
   range, and shuffle it into a run deck. */

// range is { low: {letter, octave}, high: {letter, octave} }.
// `extra` is merged into every note (Sight Reading tags each note's clef).
function notesInRange(range, extra) {
  const lowStep = absStep(range.low.letter, range.low.octave);
  const highStep = absStep(range.high.letter, range.high.octave);
  const notes = [];
  for (let step = lowStep; step <= highStep; step++) {
    notes.push(Object.assign(
      { letter: LETTER_ORDER[step % 7], octave: Math.floor(step / 7), step },
      extra
    ));
  }
  return notes;
}

// Fisher-Yates, in place
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

function allNotesForClef(clef) {
  return notesInRange(CLEF_RANGES[clef], { clef });
}

function buildRunDeck(mode) {
  return shuffle(mode === "mixed"
    ? allNotesForClef("treble").concat(allNotesForClef("bass"))
    : allNotesForClef(mode));
}

function startRun() {
  runDeck = buildRunDeck(srState.clef);
  runIndex = 0;
  runStart = null;
}

/* ---------- Sound effects (Web Audio, no external files) ---------- */

let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    audioCtx = new Ctx();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

// Natural-note semitone offsets from C, used to compute real pitch (MIDI/Hz)
// for the exact note shown on the flashcard.
const NOTE_SEMITONES = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

function noteToFrequency(letter, octave) {
  const midi = (octave + 1) * 12 + NOTE_SEMITONES[letter];
  return 440 * Math.pow(2, (midi - 69) / 12);
}

// sustain = how long the note rings. Sight reading uses a short confirmation
// blip; ear training holds it much longer so the pitch can be studied.
function playNoteSound(freq, sustain = 0.55) {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "triangle";
  osc.frequency.setValueAtTime(freq, now);
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.28, now + 0.02);
  gain.gain.setValueAtTime(0.28, now + sustain * 0.55);
  gain.gain.exponentialRampToValueAtTime(0.001, now + sustain);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + sustain + 0.05);
  return sustain;
}

function playBonkSound() {
  const ctx = getAudioCtx();
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(180, now);
  osc.frequency.exponentialRampToValueAtTime(60, now + 0.18);
  gain.gain.setValueAtTime(0.3, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 0.25);
}

const CLEF_RANGES = {
  treble: { low: { letter: "C", octave: 4 }, high: { letter: "C", octave: 6 }, refLetter: "E", refOctave: 4 },
  bass: { low: { letter: "E", octave: 2 }, high: { letter: "C", octave: 4 }, refLetter: "G", refOctave: 2 },
};

function absStep(letter, octave) {
  return octave * 7 + LETTER_ORDER.indexOf(letter);
}

const SR_DEFAULTS = {
  streak: 0, best: 0, correct: 0, total: 0, clef: "treble",
  bestMs: { treble: null, bass: null, mixed: null },
};

function normalizeSR(state) {
  const s = Object.assign({}, SR_DEFAULTS, state);
  s.bestMs = Object.assign({ treble: null, bass: null, mixed: null }, s.bestMs || {});
  // migrate the old mixed-only record field
  if (state && state.bestMixedMs && !s.bestMs.mixed) s.bestMs.mixed = state.bestMixedMs;
  delete s.bestMixedMs;
  return s;
}

function loadSR() {
  const raw = localStorage.getItem(SR_KEY);
  if (!raw) return normalizeSR(null);
  try {
    return normalizeSR(JSON.parse(raw));
  } catch (e) {
    return normalizeSR(null);
  }
}

function saveSR() {
  localStorage.setItem(SR_KEY, JSON.stringify(srState));
}

let srState = loadSR();
let currentNote = null;
let currentClef = null;
let srLocked = false;



function ledgerYs(y, topY, bottomY, spacing) {
  const ys = [];
  if (y < topY - 0.01) {
    for (let ly = topY - spacing; ly >= y - 0.01; ly -= spacing) ys.push(ly);
  } else if (y > bottomY + 0.01) {
    for (let ly = bottomY + spacing; ly <= y + 0.01; ly += spacing) ys.push(ly);
  }
  return ys;
}

// Real clef outlines extracted straight from Bravura (the actual music
// engraving font used by MuseScore/VexFlow etc, SIL Open Font License),
// glyphs U+E050 (G clef) and U+E062 (F clef). Not a lookalike -- this is
// the same shape as real sheet music.
const TREBLE_CLEF_D = "M376-415C374-427 376-428 382-434C398-449 419-470 438-491C522-583 572-702 572-815C572-902 548-988 507-1048C492-1070 466-1098 455-1098C441-1098 410-1072 390-1050C316-968 292-843 292-739C292-681 299-616 306-575C308-563 309-561 297-551C233-498 164-437 112-373C43-287 0-194 0-87C0 87 119 252 364 252C387 252 413 250 433 246C444 244 446 243 448 255C460 322 475 409 475 456C475 604 375 622 316 622C262 622 236 606 236 593C236 586 245 583 268 576C299 567 335 540 335 482C335 427 300 380 239 380C172 380 132 433 132 495C132 560 171 658 322 658C389 658 519 628 519 458C519 401 501 306 490 244C488 232 489 233 503 227C604 187 671 102 671-11C671-139 577-252 430-252C404-252 404-252 401-270M470-943C503-943 530-916 530-861C530-792 497-728 419-650C403-634 379-611 356-591C349-585 345-586 343-599C339-625 337-659 337-691C337-847 409-943 470-943M361-262C364-243 364-244 346-238C258-208 201-129 201-44C201 46 248 110 316 133C324 136 336 139 343 139C351 139 355 134 355 128C355 121 347 118 340 115C298 97 268 54 268 8C268-49 307-92 368-109C384-113 386-112 388-101L438 197C440 208 439 208 424 211C408 214 388 216 368 216C193 216 80 119 80-20C80-79 90-158 173-252C233-319 279-356 326-394C336-402 338-401 340-390M430-103C428-115 429-118 441-117C522-110 589-42 589 46C589 109 551 160 495 188C483 194 481 194 479 182";
const BASS_CLEF_D = "M252-262C78-262 0-135 0-39C0 41 42 110 123 110C186 110 229 66 229 4C229-60 182-100 133-100C106-100 96-93 83-93C70-93 67-101 67-111C67-151 127-224 229-224C335-224 381-120 381 37C381 140 359 260 297 356C237 449 134 534 10 605C1 610-5 615-5 623C-5 629-1 635 8 635C13 635 19 633 25 630C158 565 286 489 392 375C479 281 531 159 531 28C531-146 425-262 252-262M629-180C598-180 574-156 574-125C574-94 598-70 629-70C660-70 684-94 684-125C684-156 660-180 629-180M630 71C599 71 576 94 576 125C576 156 599 179 630 179C661 179 684 156 684 125C684 94 661 71 630 71";

// SMuFL glyph convention: a clef glyph's own origin (0,0) sits exactly on
// the staff line it belongs to -- G4 for the G clef, F3 for the F clef.
// So positioning is just "put the origin on that line's y", no guessing.
const CLEF_FONT_UNITS_PER_STAFF_SPACE = 250; // Bravura unitsPerEm(1000) / 4

function trebleClefPath(x, topY, spacing) {
  const scale = spacing / CLEF_FONT_UNITS_PER_STAFF_SPACE;
  const g4Y = topY + 3 * spacing; // G4 = 2nd line from bottom
  return `<g transform="translate(${x}, ${g4Y}) scale(${scale})"><path d="${TREBLE_CLEF_D}" fill="#222"/></g>`;
}

function bassClefPath(x, topY, spacing) {
  const scale = spacing / CLEF_FONT_UNITS_PER_STAFF_SPACE;
  const f3Y = topY + spacing; // F3 = 2nd line from top
  return `<g transform="translate(${x}, ${f3Y}) scale(${scale})"><path d="${BASS_CLEF_D}" fill="#222"/></g>`;
}

function drawStaff(note, clef) {
  const svg = document.getElementById("staffSvg");
  const spacing = 9;
  const topY = 50;
  const bottomY = topY + spacing * 4;
  const noteX = 150;

  const range = CLEF_RANGES[clef];
  const refStep = absStep(range.refLetter, range.refOctave);
  const deltaSteps = note.step - refStep;
  const noteY = bottomY - deltaSteps * (spacing / 2);

  let svgContent = "";
  // 5 staff lines
  for (let i = 0; i < 5; i++) {
    const y = topY + i * spacing;
    svgContent += `<line x1="10" y1="${y}" x2="195" y2="${y}" stroke="#333" stroke-width="1"/>`;
  }

  // clef symbol, drawn as vector paths (no font/glyph dependency)
  if (clef === "treble") {
    svgContent += trebleClefPath(12, topY, spacing);
  } else {
    svgContent += bassClefPath(12, topY, spacing);
  }

  // ledger lines
  ledgerYs(noteY, topY, bottomY, spacing).forEach(ly => {
    svgContent += `<line x1="${noteX - 10}" y1="${ly}" x2="${noteX + 10}" y2="${ly}" stroke="#333" stroke-width="1"/>`;
  });

  // Note head. In real engraving a notehead is exactly ONE staff space tall
  // and slightly wider than tall, tilted. Sizing it relative to `spacing`
  // keeps "on a line" vs "in a space" unambiguous -- an oversized head
  // spills across both neighbouring lines and makes D/E look identical.
  const headRy = spacing * 0.5;
  const headRx = spacing * 0.66;
  svgContent += `<ellipse cx="${noteX}" cy="${noteY}" rx="${headRx}" ry="${headRy}" fill="#222" transform="rotate(-20 ${noteX} ${noteY})"/>`;

  svg.innerHTML = svgContent;
}

function renderAnswerGrid() {
  const grid = document.getElementById("srAnswers");
  grid.innerHTML = NOTE_LETTERS.map(l => `<button class="note-btn" data-letter="${l}" title="Press ${l} on your keyboard">${l}</button>`).join("");
  grid.querySelectorAll(".note-btn").forEach(btn => {
    btn.addEventListener("click", () => checkAnswer(btn));
  });
}

function updateSRStats() {
  document.getElementById("srStreak").textContent = srState.streak;
  document.getElementById("srBest").textContent = srState.best;
  const pct = srState.total ? Math.round((srState.correct / srState.total) * 100) : 0;
  document.getElementById("srAccuracy").textContent = pct + "%";

  document.getElementById("srProgress").textContent = `${runIndex}/${runDeck.length}`;
  const record = srState.bestMs[srState.clef];
  document.getElementById("srRecord").textContent = record ? formatClock(record / 1000) : "--";
}

function nextCard() {
  srLocked = false;
  if (!runDeck.length || runIndex >= runDeck.length) startRun();
  currentNote = runDeck[runIndex];
  currentClef = currentNote.clef;
  drawStaff(currentNote, currentClef);
  const fb = document.getElementById("srFeedback");
  fb.textContent = runStart === null
    ? `Perfect run: all ${runDeck.length} notes, no mistakes. Go!`
    : "What note is this?";
  fb.className = "practice-feedback";
  renderAnswerGrid();
  updateSRStats();
}

function checkAnswer(btn) {
  if (srLocked || !currentNote || !btn) return;
  srLocked = true;
  btn.focus({ preventScroll: true });
  const guess = btn.dataset.letter;
  const correct = guess === currentNote.letter;
  const feedback = document.getElementById("srFeedback");

  let delay = correct ? 700 : 1400;

  srState.total++;
  if (correct) {
    playNoteSound(noteToFrequency(currentNote.letter, currentNote.octave));
    srState.correct++;
    srState.streak++;
    srState.best = Math.max(srState.best, srState.streak);
    btn.classList.add("correct");
    feedback.textContent = `Correct! ${currentNote.letter}${currentNote.octave} 🔥`;
    feedback.className = "practice-feedback good";

    if (runStart === null) runStart = Date.now();
    runIndex++;
    if (runIndex >= runDeck.length) {
      const elapsed = Date.now() - runStart;
      const prev = srState.bestMs[srState.clef];
      const isRecord = !prev || elapsed < prev;
      if (isRecord) srState.bestMs[srState.clef] = elapsed;
      feedback.textContent = isRecord
        ? `🏆 NEW RECORD! All ${runDeck.length} notes in ${formatClock(elapsed / 1000)}`
        : `✅ Perfect run in ${formatClock(elapsed / 1000)} (record ${formatClock(srState.bestMs[srState.clef] / 1000)})`;
      feedback.className = "practice-feedback good";
      startRun();
      delay = 2600;
    }
  } else {
    playBonkSound();
    srState.streak = 0;
    btn.classList.add("wrong");
    const rightBtn = document.querySelector(`.note-btn[data-letter="${currentNote.letter}"]`);
    if (rightBtn) rightBtn.classList.add("correct");
    feedback.textContent = `That was ${currentNote.letter}${currentNote.octave} — run reset, starting over`;
    feedback.className = "practice-feedback bad";
    startRun();
  }
  saveSR();
  updateSRStats();
  setTimeout(nextCard, delay);
}

function syncClefButtons() {
  document.querySelectorAll(".mode-select .tab-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.clef === srState.clef);
  });
}

document.querySelectorAll(".mode-select .tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    srState.clef = btn.dataset.clef;
    syncClefButtons();
    startRun();
    srSessionStart = Date.now();
    saveSR();
    updateSRTimer();
    nextCard();
  });
});

syncClefButtons();

/* ---------- Ear Training ----------
   Same perfect-run shape as Sight Reading, but the note is PLAYED instead
   of drawn. Held much longer so the pitch can actually be studied.
------------------------------------- */

const ET_KEY = "forge_eartraining_v1";
const ET_SUSTAIN = 1.8; // seconds a note rings for

const ET_RANGES = {
  low:    { low: { letter: "G", octave: 2 }, high: { letter: "B", octave: 3 } },
  middle: { low: { letter: "C", octave: 4 }, high: { letter: "B", octave: 4 } },
  high:   { low: { letter: "C", octave: 5 }, high: { letter: "C", octave: 6 } },
  full:   { low: { letter: "G", octave: 2 }, high: { letter: "C", octave: 6 } },
};

const ET_DEFAULTS = {
  streak: 0, best: 0, correct: 0, total: 0, range: "middle",
  bestMs: { low: null, middle: null, high: null, full: null },
};

function normalizeET(state) {
  const s = Object.assign({}, ET_DEFAULTS, state);
  s.bestMs = Object.assign({ low: null, middle: null, high: null, full: null }, s.bestMs || {});
  if (!ET_RANGES[s.range]) s.range = "middle";
  return s;
}

function loadET() {
  const raw = localStorage.getItem(ET_KEY);
  if (!raw) return normalizeET(null);
  try {
    return normalizeET(JSON.parse(raw));
  } catch (e) {
    return normalizeET(null);
  }
}

function saveET() {
  localStorage.setItem(ET_KEY, JSON.stringify(etState));
}

let etState = loadET();
let etDeck = [];
let etIndex = 0;
let etStart = null;
let etCurrent = null;
let etLocked = false;

function etBuildDeck(range) {
  return shuffle(notesInRange(ET_RANGES[range]));
}

function etStartRun() {
  etDeck = etBuildDeck(etState.range);
  etIndex = 0;
  etStart = null;
}

function etUpdateTimer() {
  const el = document.getElementById("etTimer");
  if (!el) return;
  const secs = etStart ? (Date.now() - etStart) / 1000 : 0;
  el.textContent = formatClock(secs);
}

function etUpdateStats() {
  document.getElementById("etStreak").textContent = etState.streak;
  document.getElementById("etBest").textContent = etState.best;
  const pct = etState.total ? Math.round((etState.correct / etState.total) * 100) : 0;
  document.getElementById("etAccuracy").textContent = pct + "%";
  document.getElementById("etProgress").textContent = `${etIndex}/${etDeck.length}`;
  const record = etState.bestMs[etState.range];
  document.getElementById("etRecord").textContent = record ? formatClock(record / 1000) : "--";
}

function etPlayCurrent() {
  if (!etCurrent) return;
  playNoteSound(noteToFrequency(etCurrent.letter, etCurrent.octave), ET_SUSTAIN);
  const emoji = document.getElementById("etEmoji");
  if (emoji) {
    emoji.classList.add("ringing");
    setTimeout(() => emoji.classList.remove("ringing"), 220);
  }
}

function etRenderAnswers() {
  const grid = document.getElementById("etAnswers");
  grid.innerHTML = NOTE_LETTERS
    .map(l => `<button class="note-btn" data-etletter="${l}" title="Press ${l} on your keyboard">${l}</button>`)
    .join("");
  grid.querySelectorAll(".note-btn").forEach(btn => {
    btn.addEventListener("click", () => etCheckAnswer(btn));
  });
}

function etNextCard() {
  etLocked = false;
  if (!etDeck.length || etIndex >= etDeck.length) etStartRun();
  etCurrent = etDeck[etIndex];
  const fb = document.getElementById("etFeedback");
  fb.textContent = etStart === null
    ? `Perfect run: all ${etDeck.length} notes by ear. Go!`
    : "Listen, then pick the note";
  fb.className = "practice-feedback";
  etRenderAnswers();
  etUpdateStats();
  etPlayCurrent();
}

function etCheckAnswer(btn) {
  if (etLocked || !etCurrent || !btn) return;
  etLocked = true;
  btn.focus({ preventScroll: true });
  const guess = btn.dataset.etletter;
  const correct = guess === etCurrent.letter;
  const feedback = document.getElementById("etFeedback");
  let delay = correct ? 900 : 1600;

  etState.total++;
  if (correct) {
    etState.correct++;
    etState.streak++;
    etState.best = Math.max(etState.best, etState.streak);
    btn.classList.add("correct");
    feedback.textContent = `Correct! ${etCurrent.letter}${etCurrent.octave} 🔥`;
    feedback.className = "practice-feedback good";

    if (etStart === null) etStart = Date.now();
    etIndex++;
    if (etIndex >= etDeck.length) {
      const elapsed = Date.now() - etStart;
      const prev = etState.bestMs[etState.range];
      const isRecord = !prev || elapsed < prev;
      if (isRecord) etState.bestMs[etState.range] = elapsed;
      feedback.textContent = isRecord
        ? `🏆 NEW RECORD! All ${etDeck.length} notes by ear in ${formatClock(elapsed / 1000)}`
        : `✅ Perfect run in ${formatClock(elapsed / 1000)} (record ${formatClock(etState.bestMs[etState.range] / 1000)})`;
      feedback.className = "practice-feedback good";
      etStartRun();
      delay = 2600;
    }
  } else {
    playBonkSound();
    etState.streak = 0;
    btn.classList.add("wrong");
    const rightBtn = document.querySelector(`.note-btn[data-etletter="${etCurrent.letter}"]`);
    if (rightBtn) rightBtn.classList.add("correct");
    feedback.textContent = `That was ${etCurrent.letter}${etCurrent.octave} — run reset, starting over`;
    feedback.className = "practice-feedback bad";
    etStartRun();
  }
  saveET();
  etUpdateStats();
  setTimeout(etNextCard, delay);
}

function syncEtButtons() {
  document.querySelectorAll("[data-etrange]").forEach(b => {
    b.classList.toggle("active", b.dataset.etrange === etState.range);
  });
}

document.querySelectorAll("[data-etrange]").forEach(btn => {
  btn.addEventListener("click", () => {
    etState.range = btn.dataset.etrange;
    syncEtButtons();
    etStartRun();
    saveET();
    etUpdateTimer();
    etNextCard();
  });
});

const etReplayBtn = document.getElementById("etReplay");
if (etReplayBtn) etReplayBtn.addEventListener("click", etPlayCurrent);

syncEtButtons();

document.addEventListener("keydown", (e) => {
  const tag = document.activeElement?.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || document.activeElement?.isContentEditable) return;

  const sightActive = document.getElementById("tab-sightread").classList.contains("active");
  const earActive = document.getElementById("tab-ear").classList.contains("active");
  if (!sightActive && !earActive) return;

  const letter = e.key.toUpperCase();

  if (earActive) {
    if (e.key === " " || letter === "R") {
      e.preventDefault();
      etPlayCurrent();
      return;
    }
    if (!NOTE_LETTERS.includes(letter)) return;
    e.preventDefault();
    etCheckAnswer(document.querySelector(`.note-btn[data-etletter="${letter}"]`));
    return;
  }

  if (!NOTE_LETTERS.includes(letter)) return;
  e.preventDefault();
  checkAnswer(document.querySelector(`.note-btn[data-letter="${letter}"]`));
});

// Installable app: the service worker makes Forge work with no signal.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {
      // No service worker (e.g. opened over plain http) just means no
      // offline support -- the app itself still works.
    });
  });
}

archiveCompletedWeeks();
render();

setInterval(() => {
  if (document.getElementById("tab-sightread").classList.contains("active")) updateSRTimer();
  if (document.getElementById("tab-ear").classList.contains("active")) etUpdateTimer();
  const anyRunning = habits.some(h => h.trackTime && h.practice && h.practice.sessionStart);
  if (anyRunning) {
    habits.forEach(habit => {
      if (!habit.trackTime || !habit.practice || !habit.practice.sessionStart) return;
      const timeEl = document.getElementById(`sw-time-${habit.id}`);
      if (timeEl) timeEl.textContent = formatHMS(liveTodaySeconds(habit));
    });
  }
  const before = habits.map(h => (h.practice ? h.practice.history.length : 0));
  archiveCompletedWeeks();
  const changed = habits.some((h, i) => (h.practice ? h.practice.history.length : 0) !== before[i]);
  if (changed) render();
}, 1000);
</script>
