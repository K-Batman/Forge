<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #171a24;
    --card-border: #262a38;
    --text: #eef0f5;
    --muted: #8890a4;
    --accent: #ff7a1a;
    --accent-glow: rgba(255, 122, 26, 0.35);
    --good: #3ddc84;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #1a1d29 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  header {
    text-align: center;
    margin-bottom: 28px;
  }
  header h1 {
    font-size: 2.2rem;
    margin: 0;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #ff7a1a, #ffb347);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p {
    color: var(--muted);
    margin: 6px 0 0;
    font-size: 0.95rem;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
  }
  .habit-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: border-color 0.2s;
  }
  .habit-card.done {
    border-color: var(--good);
  }
  .habit-icon {
    font-size: 2rem;
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1f2330;
    border-radius: 12px;
    flex-shrink: 0;
  }
  .habit-info {
    flex: 1;
    min-width: 0;
  }
  .habit-info h2 {
    margin: 0 0 2px;
    font-size: 1.1rem;
  }
  .habit-stats {
    display: flex;
    gap: 14px;
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 4px;
    flex-wrap: wrap;
  }
  .habit-stats span b {
    color: var(--text);
  }
  .check-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 2px solid var(--card-border);
    background: transparent;
    color: var(--muted);
    font-size: 1.3rem;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .check-btn.checked {
    background: var(--good);
    border-color: var(--good);
    color: #0f1117;
    box-shadow: 0 0 14px rgba(61, 220, 132, 0.5);
  }
  .check-btn:active {
    transform: scale(0.9);
  }
  .streak-flame {
    color: var(--accent);
  }
  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-top: 10px;
  }
  .cal-day {
    aspect-ratio: 1;
    border-radius: 4px;
    background: #1f2330;
  }
  .cal-day.hit {
    background: var(--good);
  }
  .footer-actions {
    text-align: center;
    margin-top: 30px;
  }
  .add-btn {
    background: transparent;
    border: 1px dashed var(--card-border);
    color: var(--muted);
    padding: 12px 20px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .add-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  dialog {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 20px;
    max-width: 320px;
    width: 90%;
  }
  dialog::backdrop {
    background: rgba(0,0,0,0.6);
  }
  dialog input, dialog select {
    width: 100%;
    padding: 8px 10px;
    margin: 6px 0 12px;
    background: #1f2330;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.95rem;
  }
  dialog label {
    font-size: 0.8rem;
    color: var(--muted);
  }
  .dialog-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }
  .dialog-actions button {
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .btn-cancel {
    background: transparent;
    color: var(--muted);
  }
  .btn-save {
    background: var(--accent);
    color: #0f1117;
    font-weight: 600;
  }
  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔥 Forge</h1>
    <p id="tagline">Build the habit. Every day.</p>
  </header>

  <div id="habitList"></div>

  <div class="footer-actions">
    <button class="add-btn" id="addHabitBtn">+ Add a habit</button>
  </div>
</div>

<dialog id="habitDialog">
  <h3 style="margin-top:0">New habit</h3>
  <label for="hName">Name</label>
  <input id="hName" placeholder="e.g. Read a book" maxlength="30">
  <label for="hIcon">Icon (emoji)</label>
  <input id="hIcon" placeholder="📖" maxlength="4">
  <div class="dialog-actions">
    <button class="btn-cancel" id="cancelDialog">Cancel</button>
    <button class="btn-save" id="saveDialog">Add</button>
  </div>
</dialog>

<script>
/* ---------- Data model ----------
  Each habit: { id, name, icon, log: { "YYYY-MM-DD": true, ... } }
  Stored in localStorage under "forge_habits_v1"
  Adding new habits later = just add to the defaults array or use the + button.
------------------------------------- */

const STORAGE_KEY = "forge_habits_v1";

const DEFAULT_HABITS = [
  { id: "bible", name: "Bible Reading", icon: "📖", log: {} },
  { id: "piano", name: "Piano Practice", icon: "🎹", log: {} },
];

function todayStr(offsetDays = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  return d.toISOString().slice(0, 10);
}

function loadHabits() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return structuredClone(DEFAULT_HABITS);
  try {
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed) && parsed.length) return parsed;
  } catch (e) {}
  return structuredClone(DEFAULT_HABITS);
}

function saveHabits(habits) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
}

function calcStreak(log) {
  let streak = 0;
  let i = 0;
  // if today isn't done yet, streak counts backward from yesterday
  while (true) {
    const day = todayStr(-i);
    if (log[day]) {
      streak++;
      i++;
    } else {
      if (i === 0) return 0; // today not done, no streak credit yet
      break;
    }
  }
  return streak;
}

function calcTotal(log) {
  return Object.values(log).filter(Boolean).length;
}

function calcBest(log) {
  const days = Object.keys(log).filter(d => log[d]).sort();
  if (!days.length) return 0;
  let best = 1, cur = 1;
  for (let i = 1; i < days.length; i++) {
    const prev = new Date(days[i - 1]);
    const cur_d = new Date(days[i]);
    const diff = (cur_d - prev) / 86400000;
    if (diff === 1) {
      cur++;
      best = Math.max(best, cur);
    } else {
      cur = 1;
    }
  }
  return Math.max(best, calcStreak(log));
}

let habits = loadHabits();

function render() {
  const list = document.getElementById("habitList");
  list.innerHTML = "";

  if (!habits.length) {
    list.innerHTML = `<div class="empty-state">No habits yet. Add one below to start forging. 🔥</div>`;
    return;
  }

  const today = todayStr();

  habits.forEach(habit => {
    const doneToday = !!habit.log[today];
    const streak = calcStreak(habit.log);
    const total = calcTotal(habit.log);
    const best = calcBest(habit.log);

    const card = document.createElement("div");
    card.className = "habit-card" + (doneToday ? " done" : "");
    card.innerHTML = `
      <div class="habit-icon">${habit.icon}</div>
      <div class="habit-info">
        <h2>${escapeHtml(habit.name)}</h2>
        <div class="habit-stats">
          <span class="streak-flame">🔥 <b>${streak}</b> day streak</span>
          <span>Best: <b>${best}</b></span>
          <span>Total: <b>${total}</b></span>
        </div>
      </div>
      <button class="check-btn ${doneToday ? "checked" : ""}" data-id="${habit.id}">
        ${doneToday ? "✓" : ""}
      </button>
    `;
    list.appendChild(card);
  });

  list.querySelectorAll(".check-btn").forEach(btn => {
    btn.addEventListener("click", () => toggleToday(btn.dataset.id));
  });
}

function toggleToday(id) {
  const habit = habits.find(h => h.id === id);
  if (!habit) return;
  const today = todayStr();
  if (habit.log[today]) {
    delete habit.log[today];
  } else {
    habit.log[today] = true;
  }
  saveHabits(habits);
  render();
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// Add habit dialog
const dialog = document.getElementById("habitDialog");
document.getElementById("addHabitBtn").addEventListener("click", () => {
  document.getElementById("hName").value = "";
  document.getElementById("hIcon").value = "";
  dialog.showModal();
});
document.getElementById("cancelDialog").addEventListener("click", () => dialog.close());
document.getElementById("saveDialog").addEventListener("click", () => {
  const name = document.getElementById("hName").value.trim();
  const icon = document.getElementById("hIcon").value.trim() || "⭐";
  if (!name) return;
  const id = name.toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-" + Date.now().toString(36);
  habits.push({ id, name, icon, log: {} });
  saveHabits(habits);
  dialog.close();
  render();
});

render();
</script>
</body>
</html>
