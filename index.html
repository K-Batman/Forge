<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #171a24;
    --card-border: #262a38;
    --text: #eef0f5;
    --muted: #8890a4;
    --accent: #ff7a1a;
    --accent-glow: rgba(255, 122, 26, 0.35);
    --good: #3ddc84;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #1a1d29 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  header {
    text-align: center;
    margin-bottom: 28px;
  }
  header h1 {
    font-size: 2.2rem;
    margin: 0;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #ff7a1a, #ffb347);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p {
    color: var(--muted);
    margin: 6px 0 0;
    font-size: 0.95rem;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
  }
  .habit-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: border-color 0.2s;
  }
  .habit-card.done {
    border-color: var(--good);
  }
  .habit-icon {
    font-size: 2rem;
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1f2330;
    border-radius: 12px;
    flex-shrink: 0;
  }
  .habit-info {
    flex: 1;
    min-width: 0;
  }
  .habit-info h2 {
    margin: 0 0 2px;
    font-size: 1.1rem;
  }
  .habit-stats {
    display: flex;
    gap: 14px;
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 4px;
    flex-wrap: wrap;
  }
  .habit-stats span b {
    color: var(--text);
  }
  .check-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 2px solid var(--card-border);
    background: transparent;
    color: var(--muted);
    font-size: 1.3rem;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .check-btn.checked {
    background: var(--good);
    border-color: var(--good);
    color: #0f1117;
    box-shadow: 0 0 14px rgba(61, 220, 132, 0.5);
  }
  .check-btn:active {
    transform: scale(0.9);
  }
  .streak-flame {
    color: var(--accent);
  }
  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-top: 10px;
  }
  .cal-day {
    aspect-ratio: 1;
    border-radius: 4px;
    background: #1f2330;
  }
  .cal-day.hit {
    background: var(--good);
  }
  .footer-actions {
    text-align: center;
    margin-top: 30px;
  }
  .add-btn {
    background: transparent;
    border: 1px dashed var(--card-border);
    color: var(--muted);
    padding: 12px 20px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .add-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  dialog {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 20px;
    max-width: 320px;
    width: 90%;
  }
  dialog::backdrop {
    background: rgba(0,0,0,0.6);
  }
  dialog input, dialog select {
    width: 100%;
    padding: 8px 10px;
    margin: 6px 0 12px;
    background: #1f2330;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.95rem;
  }
  dialog label {
    font-size: 0.8rem;
    color: var(--muted);
  }
  .dialog-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }
  .dialog-actions button {
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .btn-cancel {
    background: transparent;
    color: var(--muted);
  }
  .btn-save {
    background: var(--accent);
    color: #0f1117;
    font-weight: 600;
  }
  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
  }

  .stopwatch-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed var(--card-border);
    flex-wrap: wrap;
  }
  .stopwatch-time {
    font-variant-numeric: tabular-nums;
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--text);
  }
  .stopwatch-time.running {
    color: var(--accent);
  }
  .sw-btn {
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .sw-btn.start {
    background: var(--accent);
    color: #0f1117;
  }
  .sw-btn.stop {
    background: #3a1f1f;
    color: #ff8a8a;
    border: 1px solid #ff8a8a;
  }
  .sw-week-total {
    margin-left: auto;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .sw-week-total b {
    color: var(--text);
  }
  .weekly-reports {
    margin-top: 24px;
  }
  .weekly-reports h3 {
    font-size: 0.95rem;
    color: var(--muted);
    margin: 0 0 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .report-row {
    display: flex;
    justify-content: space-between;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 0.88rem;
  }
  .report-row.latest {
    border-color: var(--good);
  }
  .report-row .label {
    color: var(--muted);
  }
  .report-row .value {
    font-weight: 600;
  }
  .section-title {
    margin: 28px 0 12px;
    color: var(--muted);
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .task-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .task-card.done {
    opacity: 0.7;
    border-color: var(--good);
  }
  .task-card.late {
    border-color: #ff5c5c;
  }
  .task-main {
    flex: 1;
    min-width: 0;
  }
  .task-name {
    font-weight: 600;
  }
  .task-meta {
    color: var(--muted);
    font-size: 0.78rem;
    margin-top: 2px;
  }
  .task-meta.late-text {
    color: #ff8a8a;
  }
  .mini-btn {
    background: transparent;
    border: 1px dashed var(--card-border);
    color: var(--muted);
    padding: 9px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.82rem;
  }
  .mini-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .tabs {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 24px;
  }
  .tab-btn {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--muted);
    padding: 9px 18px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.88rem;
    font-weight: 600;
  }
  .tab-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #0f1117;
  }
  .tab-panel {
    display: none;
  }
  .tab-panel.active {
    display: block;
  }
  /* Sight Reading breaks out of the narrow .wrap column and fills the
     viewport -- it's a practice mode, not a list item. */
  #tab-sightread.active {
    width: 100vw;
    max-width: 100vw;
    margin-left: calc(-50vw + 50%);
    margin-right: calc(-50vw + 50%);
    padding: 0 16px;
    min-height: calc(100vh - 90px);
    display: flex;
    flex-direction: column;
  }
  .sr-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 24px;
    text-align: center;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .sr-stats {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-bottom: 16px;
    font-size: 1rem;
    color: var(--muted);
  }
  .sr-stats b {
    color: var(--text);
    font-size: 1.1rem;
  }
  .clef-select {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .clef-select .tab-btn {
    padding: 11px 24px;
    font-size: 1rem;
  }
  .staff-wrap {
    background: #eef0f5;
    border-radius: 12px;
    padding: 16px 0;
    margin-bottom: 24px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 260px;
  }
  .staff-wrap svg {
    width: 100%;
    height: 100%;
    max-height: 420px;
  }
  .answer-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 12px;
  }
  .note-btn {
    padding: 22px 0;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    background: #1f2330;
    color: var(--text);
    font-size: 1.6rem;
    font-weight: 700;
    cursor: pointer;
  }
  .note-btn:active {
    transform: scale(0.95);
  }
  .note-btn.correct {
    background: var(--good);
    color: #0f1117;
    border-color: var(--good);
  }
  .note-btn.wrong {
    background: #ff5c5c;
    color: #0f1117;
    border-color: #ff5c5c;
  }
  .sr-feedback {
    min-height: 30px;
    font-size: 1.1rem;
    margin-bottom: 12px;
    font-weight: 600;
  }
  .sr-feedback.good { color: var(--good); }
  .sr-feedback.bad { color: #ff8a8a; }
  @media (min-width: 700px) {
    .note-btn { font-size: 1.9rem; padding: 26px 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔥 Forge</h1>
    <p id="tagline">Build the habit. Every day.</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="habits">Habits</button>
    <button class="tab-btn" data-tab="sightread">🎼 Sight Reading</button>
  </div>

  <div id="tab-habits" class="tab-panel active">
    <div id="habitList"></div>

    <div id="weeklyReports"></div>

    <div id="taskSection"></div>

    <div class="footer-actions">
      <button class="add-btn" id="addHabitBtn">+ Add a habit</button>
    </div>
  </div>

  <div id="tab-sightread" class="tab-panel">
    <div class="sr-card">
      <div class="sr-stats">
        <span>Streak: <b id="srStreak">0</b></span>
        <span>Best: <b id="srBest">0</b></span>
        <span>Accuracy: <b id="srAccuracy">0%</b></span>
      </div>
      <div class="clef-select">
        <button class="tab-btn active" data-clef="treble">Treble 🎵</button>
        <button class="tab-btn" data-clef="bass">Bass 🎵</button>
      </div>
      <div class="staff-wrap">
        <svg id="staffSvg" viewBox="0 -25 200 175" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div class="sr-feedback" id="srFeedback">What note is this?</div>
      <div class="answer-grid" id="srAnswers"></div>
    </div>
  </div>
</div>

<dialog id="habitDialog">
  <h3 style="margin-top:0">New habit</h3>
  <label for="hName">Name</label>
  <input id="hName" placeholder="e.g. Read a book" maxlength="30">
  <label for="hIcon">Icon (emoji)</label>
  <input id="hIcon" placeholder="📖" maxlength="4">
  <div class="dialog-actions">
    <button class="btn-cancel" id="cancelDialog">Cancel</button>
    <button class="btn-save" id="saveDialog">Add</button>
  </div>
</dialog>

<dialog id="taskDialog">
  <h3 style="margin-top:0">New chore / reminder</h3>
  <label for="tName">Task</label>
  <input id="tName" placeholder="e.g. Take trash out" maxlength="40">
  <label for="tIcon">Icon (emoji)</label>
  <input id="tIcon" placeholder="✅" maxlength="4">
  <label for="tRepeat">Repeat</label>
  <select id="tRepeat">
    <option value="daily">Daily</option>
    <option value="weekly">Weekly</option>
    <option value="once">Once</option>
  </select>
  <label for="tDue">Due time (optional)</label>
  <input id="tDue" type="time">
  <div class="dialog-actions">
    <button class="btn-cancel" id="cancelTaskDialog">Cancel</button>
    <button class="btn-save" id="saveTaskDialog">Add</button>
  </div>
</dialog>

<script>
/* ---------- Data model ----------
  Each habit: { id, name, icon, log: { "YYYY-MM-DD": true, ... } }
  Stored in localStorage under "forge_habits_v1"
  Adding new habits later = just add to the defaults array or use the + button.
------------------------------------- */

const STORAGE_KEY = "forge_habits_v1";
const TASKS_KEY = "forge_tasks_v1";

const DEFAULT_HABITS = [
  { id: "bible", name: "Bible Reading", icon: "📖", log: {} },
  {
    id: "piano", name: "Piano Practice", icon: "🎹", log: {},
    trackTime: true,
    practice: { seconds: {}, sessionStart: null, history: [] },
  },
  { id: "math", name: "Math", icon: "➗", log: {} },
  { id: "reading", name: "Reading", icon: "📚", log: {} },
  { id: "science", name: "Science", icon: "🔬", log: {} },
];

const DEFAULT_TASKS = [
  { id: "make-bed", name: "Make bed", icon: "🛏️", repeat: "daily", dueTime: "09:00", done: {} },
  { id: "tidy-room", name: "Tidy room", icon: "🧹", repeat: "daily", dueTime: "", done: {} },
  { id: "trash", name: "Take trash out", icon: "🗑️", repeat: "weekly", dueTime: "18:00", done: {} },
];

function todayStr(offsetDays = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  return d.toISOString().slice(0, 10);
}

function dateKey(d) {
  return d.toISOString().slice(0, 10);
}

// Migrate old saved habits so new fields exist without wiping progress.
function migrateHabit(habit) {
  if (habit.trackTime && !habit.practice) {
    habit.practice = { seconds: {}, sessionStart: null, history: [] };
  }
  if (habit.practice) {
    if (!habit.practice.seconds) habit.practice.seconds = {};
    if (!habit.practice.history) habit.practice.history = [];
    if (habit.practice.sessionStart === undefined) habit.practice.sessionStart = null;
  }
  return habit;
}

function loadHabits() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return structuredClone(DEFAULT_HABITS);
  try {
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed) && parsed.length) {
      const migrated = parsed.map(migrateHabit);
      DEFAULT_HABITS.forEach(defaultHabit => {
        if (!migrated.some(h => h.id === defaultHabit.id)) migrated.push(structuredClone(defaultHabit));
      });
      return migrated;
    }
  } catch (e) {}
  return structuredClone(DEFAULT_HABITS);
}

function saveHabits(habits) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
}

function loadTasks() {
  const raw = localStorage.getItem(TASKS_KEY);
  if (!raw) return structuredClone(DEFAULT_TASKS);
  try {
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed)) return parsed;
  } catch (e) {}
  return structuredClone(DEFAULT_TASKS);
}

function saveTasks(tasks) {
  localStorage.setItem(TASKS_KEY, JSON.stringify(tasks));
}

function calcStreak(log) {
  let streak = 0;
  let i = 0;
  // if today isn't done yet, streak counts backward from yesterday
  while (true) {
    const day = todayStr(-i);
    if (log[day]) {
      streak++;
      i++;
    } else {
      if (i === 0) return 0; // today not done, no streak credit yet
      break;
    }
  }
  return streak;
}

function calcTotal(log) {
  return Object.values(log).filter(Boolean).length;
}

function calcBest(log) {
  const days = Object.keys(log).filter(d => log[d]).sort();
  if (!days.length) return 0;
  let best = 1, cur = 1;
  for (let i = 1; i < days.length; i++) {
    const prev = new Date(days[i - 1]);
    const cur_d = new Date(days[i]);
    const diff = (cur_d - prev) / 86400000;
    if (diff === 1) {
      cur++;
      best = Math.max(best, cur);
    } else {
      cur = 1;
    }
  }
  return Math.max(best, calcStreak(log));
}

/* ---------- Stopwatch + weekly report helpers ---------- */

function formatHMS(totalSeconds) {
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = Math.floor(totalSeconds % 60);
  return [h, m, s].map(n => String(n).padStart(2, "0")).join(":");
}

function formatDuration(totalSeconds) {
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.round((totalSeconds % 3600) / 60);
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

function startOfWeek(date) {
  const d = new Date(date);
  const day = d.getDay(); // 0 Sun .. 6 Sat
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

function weekDates(monday) {
  const dates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(d.getDate() + i);
    dates.push(dateKey(d));
  }
  return dates;
}

function sumSecondsForWeek(secondsLog, monday) {
  return weekDates(monday).reduce((sum, key) => sum + (secondsLog[key] || 0), 0);
}

function currentSessionSeconds(habit) {
  if (!habit.practice || !habit.practice.sessionStart) return 0;
  return Math.floor((Date.now() - habit.practice.sessionStart) / 1000);
}

function liveTodaySeconds(habit) {
  const today = todayStr();
  const base = habit.practice.seconds[today] || 0;
  return base + currentSessionSeconds(habit);
}

function liveWeekSeconds(habit) {
  const monday = startOfWeek(new Date());
  const base = sumSecondsForWeek(habit.practice.seconds, monday);
  return base + currentSessionSeconds(habit);
}

function toggleStopwatch(id) {
  const habit = habits.find(h => h.id === id);
  if (!habit || !habit.trackTime) return;
  if (habit.practice.sessionStart) {
    // stop: commit elapsed seconds to today's log
    const elapsed = currentSessionSeconds(habit);
    const today = todayStr();
    habit.practice.seconds[today] = (habit.practice.seconds[today] || 0) + elapsed;
    habit.practice.sessionStart = null;
  } else {
    habit.practice.sessionStart = Date.now();
  }
  saveHabits(habits);
  archiveCompletedWeeks();
  render();
}

// A week's report unlocks once we're past Monday 6PM of the following week -
// that gives a grace window for a Monday-evening practice session to still
// count, then the previous Mon-Sun week gets locked in as a permanent report.
function archiveCompletedWeeks() {
  const now = new Date();
  const thisMonday = startOfWeek(now);
  const isMonday = now.getDay() === 1;
  const pastCutoff = !isMonday || now.getHours() >= 18;
  if (!pastCutoff) return;

  let changed = false;
  habits.forEach(habit => {
    if (!habit.trackTime || !habit.practice) return;
    const prevMonday = new Date(thisMonday);
    prevMonday.setDate(prevMonday.getDate() - 7);
    const weekKey = dateKey(prevMonday);
    const already = habit.practice.history.some(h => h.weekStart === weekKey);
    if (!already) {
      const total = sumSecondsForWeek(habit.practice.seconds, prevMonday);
      habit.practice.history.unshift({ weekStart: weekKey, seconds: total });
      habit.practice.history = habit.practice.history.slice(0, 12);
      changed = true;
    }
  });
  if (changed) saveHabits(habits);
}

function renderStopwatchRow(habit) {
  const running = !!habit.practice.sessionStart;
  const todaySec = liveTodaySeconds(habit);
  const weekSec = liveWeekSeconds(habit);
  return `
    <div class="stopwatch-row">
      <span class="stopwatch-time ${running ? "running" : ""}" id="sw-time-${habit.id}">${formatHMS(todaySec)}</span>
      <button class="sw-btn ${running ? "stop" : "start"}" data-sw-id="${habit.id}">${running ? "Stop" : "Start"}</button>
      <span class="sw-week-total" id="sw-week-${habit.id}">This week: <b>${formatDuration(weekSec)}</b></span>
    </div>
  `;
}

function renderWeeklyReports() {
  const box = document.getElementById("weeklyReports");
  const trackedHabits = habits.filter(h => h.trackTime && h.practice && h.practice.history.length);
  if (!trackedHabits.length) {
    box.innerHTML = "";
    return;
  }
  let html = "";
  trackedHabits.forEach(habit => {
    html += `<div class="weekly-reports"><h3>${escapeHtml(habit.name)} — Weekly Reports</h3>`;
    habit.practice.history.forEach((entry, i) => {
      const start = new Date(entry.weekStart + "T00:00:00");
      const label = start.toLocaleDateString(undefined, { month: "short", day: "numeric" });
      html += `<div class="report-row ${i === 0 ? "latest" : ""}">
        <span class="label">Week of ${label}</span>
        <span class="value">${formatDuration(entry.seconds)}</span>
      </div>`;
    });
    html += `</div>`;
  });
  box.innerHTML = html;
}

let habits = loadHabits();
let tasks = loadTasks();

function periodKeyForTask(task) {
  if (task.repeat === "weekly") return dateKey(startOfWeek(new Date()));
  if (task.repeat === "once") return "once";
  return todayStr();
}

function taskIsLate(task) {
  if (!task.dueTime || task.done[periodKeyForTask(task)]) return false;
  const now = new Date();
  if (task.repeat === "weekly") {
    const weekEnd = startOfWeek(now);
    weekEnd.setDate(weekEnd.getDate() + 6);
    const [h, m] = task.dueTime.split(":").map(Number);
    weekEnd.setHours(h, m, 0, 0);
    return now > weekEnd;
  }
  const [h, m] = task.dueTime.split(":").map(Number);
  const due = new Date();
  due.setHours(h, m, 0, 0);
  return now > due;
}

function repeatLabel(task) {
  if (task.repeat === "daily") return task.dueTime ? `Daily by ${task.dueTime}` : "Daily";
  if (task.repeat === "weekly") return task.dueTime ? `Weekly by Sunday ${task.dueTime}` : "Weekly";
  return task.dueTime ? `One time by ${task.dueTime}` : "One time";
}

function renderTasks() {
  const box = document.getElementById("taskSection");
  let html = `<h3 class="section-title">Chores + reminders</h3>`;

  if (!tasks.length) {
    html += `<div class="empty-state">No tasks yet. Add a chore or reminder below.</div>`;
  } else {
    tasks.forEach(task => {
      const key = periodKeyForTask(task);
      const done = !!task.done[key];
      const late = taskIsLate(task);
      html += `
        <div class="task-card ${done ? "done" : ""} ${late ? "late" : ""}">
          <div class="habit-icon">${task.icon}</div>
          <div class="task-main">
            <div class="task-name">${escapeHtml(task.name)}</div>
            <div class="task-meta ${late ? "late-text" : ""}">${late ? "Late — " : ""}${repeatLabel(task)}</div>
          </div>
          <button class="check-btn ${done ? "checked" : ""}" data-task-id="${task.id}">${done ? "✓" : ""}</button>
        </div>
      `;
    });
  }

  html += `<button class="mini-btn" id="addTaskBtn">+ Add chore/reminder</button>`;
  box.innerHTML = html;

  box.querySelectorAll("[data-task-id]").forEach(btn => {
    btn.addEventListener("click", () => toggleTask(btn.dataset.taskId));
  });
  document.getElementById("addTaskBtn").addEventListener("click", openTaskDialog);
}

function toggleTask(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  const key = periodKeyForTask(task);
  if (task.done[key]) delete task.done[key];
  else task.done[key] = true;
  saveTasks(tasks);
  renderTasks();
}

function render() {
  const list = document.getElementById("habitList");
  list.innerHTML = "";

  if (!habits.length) {
    list.innerHTML = `<div class="empty-state">No habits yet. Add one below to start forging. 🔥</div>`;
    return;
  }

  const today = todayStr();

  habits.forEach(habit => {
    const doneToday = !!habit.log[today];
    const streak = calcStreak(habit.log);
    const total = calcTotal(habit.log);
    const best = calcBest(habit.log);

    const card = document.createElement("div");
    card.className = "habit-card" + (doneToday ? " done" : "");
    card.innerHTML = `
      <div class="habit-icon">${habit.icon}</div>
      <div class="habit-info">
        <h2>${escapeHtml(habit.name)}</h2>
        <div class="habit-stats">
          <span class="streak-flame">🔥 <b>${streak}</b> day streak</span>
          <span>Best: <b>${best}</b></span>
          <span>Total: <b>${total}</b></span>
        </div>
        ${habit.trackTime ? renderStopwatchRow(habit) : ""}
      </div>
      <button class="check-btn ${doneToday ? "checked" : ""}" data-id="${habit.id}">
        ${doneToday ? "✓" : ""}
      </button>
    `;
    list.appendChild(card);
  });

  list.querySelectorAll(".check-btn").forEach(btn => {
    btn.addEventListener("click", () => toggleToday(btn.dataset.id));
  });
  list.querySelectorAll(".sw-btn").forEach(btn => {
    btn.addEventListener("click", () => toggleStopwatch(btn.dataset.swId));
  });

  renderWeeklyReports();
  renderTasks();
}

function toggleToday(id) {
  const habit = habits.find(h => h.id === id);
  if (!habit) return;
  const today = todayStr();
  if (habit.log[today]) {
    delete habit.log[today];
  } else {
    habit.log[today] = true;
  }
  saveHabits(habits);
  render();
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

/* ---------- Sight Reading flashcards ---------- */

const SR_KEY = "forge_sightread_v1";
const LETTER_ORDER = ["C", "D", "E", "F", "G", "A", "B"];
const NOTE_LETTERS = ["A", "B", "C", "D", "E", "F", "G"];

const CLEF_RANGES = {
  treble: { low: { letter: "C", octave: 4 }, high: { letter: "C", octave: 6 }, refLetter: "E", refOctave: 4, symbol: "\uD834\uDD1E" },
  bass: { low: { letter: "E", octave: 2 }, high: { letter: "C", octave: 4 }, refLetter: "G", refOctave: 2, symbol: "\uD834\uDD22" },
};

function absStep(letter, octave) {
  return octave * 7 + LETTER_ORDER.indexOf(letter);
}

function loadSR() {
  const raw = localStorage.getItem(SR_KEY);
  if (!raw) return { streak: 0, best: 0, correct: 0, total: 0, clef: "treble" };
  try {
    const parsed = JSON.parse(raw);
    return Object.assign({ streak: 0, best: 0, correct: 0, total: 0, clef: "treble" }, parsed);
  } catch (e) {
    return { streak: 0, best: 0, correct: 0, total: 0, clef: "treble" };
  }
}

function saveSR() {
  localStorage.setItem(SR_KEY, JSON.stringify(srState));
}

let srState = loadSR();
let currentNote = null;
let srLocked = false;

function randomNoteInRange(clef) {
  const range = CLEF_RANGES[clef];
  const lowStep = absStep(range.low.letter, range.low.octave);
  const highStep = absStep(range.high.letter, range.high.octave);
  const step = lowStep + Math.floor(Math.random() * (highStep - lowStep + 1));
  const octave = Math.floor(step / 7);
  const letter = LETTER_ORDER[step % 7];
  return { letter, octave, step };
}

function ledgerYs(y, topY, bottomY, spacing) {
  const ys = [];
  if (y < topY - 0.01) {
    for (let ly = topY - spacing; ly >= y - 0.01; ly -= spacing) ys.push(ly);
  } else if (y > bottomY + 0.01) {
    for (let ly = bottomY + spacing; ly <= y + 0.01; ly += spacing) ys.push(ly);
  }
  return ys;
}

// Real clef outlines extracted straight from Bravura (the actual music
// engraving font used by MuseScore/VexFlow etc, SIL Open Font License),
// glyphs U+E050 (G clef) and U+E062 (F clef). Not a lookalike -- this is
// the same shape as real sheet music.
const TREBLE_CLEF_D = "M376-415C374-427 376-428 382-434C398-449 419-470 438-491C522-583 572-702 572-815C572-902 548-988 507-1048C492-1070 466-1098 455-1098C441-1098 410-1072 390-1050C316-968 292-843 292-739C292-681 299-616 306-575C308-563 309-561 297-551C233-498 164-437 112-373C43-287 0-194 0-87C0 87 119 252 364 252C387 252 413 250 433 246C444 244 446 243 448 255C460 322 475 409 475 456C475 604 375 622 316 622C262 622 236 606 236 593C236 586 245 583 268 576C299 567 335 540 335 482C335 427 300 380 239 380C172 380 132 433 132 495C132 560 171 658 322 658C389 658 519 628 519 458C519 401 501 306 490 244C488 232 489 233 503 227C604 187 671 102 671-11C671-139 577-252 430-252C404-252 404-252 401-270M470-943C503-943 530-916 530-861C530-792 497-728 419-650C403-634 379-611 356-591C349-585 345-586 343-599C339-625 337-659 337-691C337-847 409-943 470-943M361-262C364-243 364-244 346-238C258-208 201-129 201-44C201 46 248 110 316 133C324 136 336 139 343 139C351 139 355 134 355 128C355 121 347 118 340 115C298 97 268 54 268 8C268-49 307-92 368-109C384-113 386-112 388-101L438 197C440 208 439 208 424 211C408 214 388 216 368 216C193 216 80 119 80-20C80-79 90-158 173-252C233-319 279-356 326-394C336-402 338-401 340-390M430-103C428-115 429-118 441-117C522-110 589-42 589 46C589 109 551 160 495 188C483 194 481 194 479 182";
const BASS_CLEF_D = "M252-262C78-262 0-135 0-39C0 41 42 110 123 110C186 110 229 66 229 4C229-60 182-100 133-100C106-100 96-93 83-93C70-93 67-101 67-111C67-151 127-224 229-224C335-224 381-120 381 37C381 140 359 260 297 356C237 449 134 534 10 605C1 610-5 615-5 623C-5 629-1 635 8 635C13 635 19 633 25 630C158 565 286 489 392 375C479 281 531 159 531 28C531-146 425-262 252-262M629-180C598-180 574-156 574-125C574-94 598-70 629-70C660-70 684-94 684-125C684-156 660-180 629-180M630 71C599 71 576 94 576 125C576 156 599 179 630 179C661 179 684 156 684 125C684 94 661 71 630 71";

// SMuFL glyph convention: a clef glyph's own origin (0,0) sits exactly on
// the staff line it belongs to -- G4 for the G clef, F3 for the F clef.
// So positioning is just "put the origin on that line's y", no guessing.
const CLEF_FONT_UNITS_PER_STAFF_SPACE = 250; // Bravura unitsPerEm(1000) / 4

function trebleClefPath(x, topY, spacing) {
  const scale = spacing / CLEF_FONT_UNITS_PER_STAFF_SPACE;
  const g4Y = topY + 3 * spacing; // G4 = 2nd line from bottom
  return `<g transform="translate(${x}, ${g4Y}) scale(${scale})"><path d="${TREBLE_CLEF_D}" fill="#222"/></g>`;
}

function bassClefPath(x, topY, spacing) {
  const scale = spacing / CLEF_FONT_UNITS_PER_STAFF_SPACE;
  const f3Y = topY + spacing; // F3 = 2nd line from top
  return `<g transform="translate(${x}, ${f3Y}) scale(${scale})"><path d="${BASS_CLEF_D}" fill="#222"/></g>`;
}

function drawStaff(note, clef) {
  const svg = document.getElementById("staffSvg");
  const spacing = 9;
  const topY = 50;
  const bottomY = topY + spacing * 4;
  const noteX = 150;

  const range = CLEF_RANGES[clef];
  const refStep = absStep(range.refLetter, range.refOctave);
  const deltaSteps = note.step - refStep;
  const noteY = bottomY - deltaSteps * (spacing / 2);

  let svgContent = "";
  // 5 staff lines
  for (let i = 0; i < 5; i++) {
    const y = topY + i * spacing;
    svgContent += `<line x1="10" y1="${y}" x2="195" y2="${y}" stroke="#333" stroke-width="1"/>`;
  }

  // clef symbol, drawn as vector paths (no font/glyph dependency)
  if (clef === "treble") {
    svgContent += trebleClefPath(12, topY, spacing);
  } else {
    svgContent += bassClefPath(12, topY, spacing);
  }

  // ledger lines
  ledgerYs(noteY, topY, bottomY, spacing).forEach(ly => {
    svgContent += `<line x1="${noteX - 10}" y1="${ly}" x2="${noteX + 10}" y2="${ly}" stroke="#333" stroke-width="1"/>`;
  });

  // note head
  svgContent += `<ellipse cx="${noteX}" cy="${noteY}" rx="7" ry="5.5" fill="#222"/>`;

  svg.innerHTML = svgContent;
}

function renderAnswerGrid() {
  const grid = document.getElementById("srAnswers");
  grid.innerHTML = NOTE_LETTERS.map(l => `<button class="note-btn" data-letter="${l}">${l}</button>`).join("");
  grid.querySelectorAll(".note-btn").forEach(btn => {
    btn.addEventListener("click", () => checkAnswer(btn));
  });
}

function updateSRStats() {
  document.getElementById("srStreak").textContent = srState.streak;
  document.getElementById("srBest").textContent = srState.best;
  const pct = srState.total ? Math.round((srState.correct / srState.total) * 100) : 0;
  document.getElementById("srAccuracy").textContent = pct + "%";
}

function nextCard() {
  srLocked = false;
  currentNote = randomNoteInRange(srState.clef);
  drawStaff(currentNote, srState.clef);
  document.getElementById("srFeedback").textContent = "What note is this?";
  document.getElementById("srFeedback").className = "sr-feedback";
  renderAnswerGrid();
  updateSRStats();
}

function checkAnswer(btn) {
  if (srLocked || !currentNote) return;
  srLocked = true;
  const guess = btn.dataset.letter;
  const correct = guess === currentNote.letter;
  const feedback = document.getElementById("srFeedback");

  srState.total++;
  if (correct) {
    srState.correct++;
    srState.streak++;
    srState.best = Math.max(srState.best, srState.streak);
    btn.classList.add("correct");
    feedback.textContent = `Correct! ${currentNote.letter}${currentNote.octave} 🔥`;
    feedback.className = "sr-feedback good";
  } else {
    srState.streak = 0;
    btn.classList.add("wrong");
    const rightBtn = document.querySelector(`.note-btn[data-letter="${currentNote.letter}"]`);
    if (rightBtn) rightBtn.classList.add("correct");
    feedback.textContent = `That was ${currentNote.letter}${currentNote.octave}`;
    feedback.className = "sr-feedback bad";
  }
  saveSR();
  updateSRStats();
  setTimeout(nextCard, correct ? 700 : 1400);
}

document.querySelectorAll(".clef-select .tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".clef-select .tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    srState.clef = btn.dataset.clef;
    saveSR();
    nextCard();
  });
});

archiveCompletedWeeks();
render();

setInterval(() => {
  const anyRunning = habits.some(h => h.trackTime && h.practice && h.practice.sessionStart);
  if (anyRunning) {
    habits.forEach(habit => {
      if (!habit.trackTime || !habit.practice || !habit.practice.sessionStart) return;
      const timeEl = document.getElementById(`sw-time-${habit.id}`);
      const weekEl = document.getElementById(`sw-week-${habit.id}`);
      if (timeEl) timeEl.textContent = formatHMS(liveTodaySeconds(habit));
      if (weekEl) weekEl.innerHTML = `This week: <b>${formatDuration(liveWeekSeconds(habit))}</b>`;
    });
  }
  const before = habits.map(h => (h.practice ? h.practice.history.length : 0));
  archiveCompletedWeeks();
  const changed = habits.some((h, i) => (h.practice ? h.practice.history.length : 0) !== before[i]);
  if (changed) render();
}, 1000);
</script>
