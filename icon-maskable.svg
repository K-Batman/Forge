<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#232838"/>
      <stop offset="60%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.45">
      <stop offset="0%" stop-color="#ff7a1a" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ff7a1a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fff0c4"/>
      <stop offset="22%" stop-color="#ffd166"/>
      <stop offset="58%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff7a1a"/>
    </linearGradient>
    <linearGradient id="inner" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#ffd166" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0.2"/>
    </linearGradient>
    
    <linearGradient id="steel" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#9aa6c4"/>
      <stop offset="55%" stop-color="#6b7694"/>
      <stop offset="100%" stop-color="#454d63"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g transform="translate(256,256) scale(0.78) translate(-256,-256)">
    

  <!-- rounded-square app icon background -->
  
  

  <!-- flame: outer body -->
  <path d="M256 92
           C 300 160 330 186 344 226
           C 360 272 338 318 300 338
           C 318 300 306 274 286 258
           C 288 292 274 318 248 330
           C 214 346 178 326 168 292
           C 158 258 174 230 200 206
           C 230 178 250 140 256 92 Z"
        fill="url(#flame)"/>

  <!-- flame: bright core -->
  <path d="M256 164
           C 282 206 296 226 298 254
           C 300 284 282 304 258 308
           C 268 286 262 268 250 256
           C 248 276 238 290 222 294
           C 204 298 190 284 190 266
           C 190 242 212 222 230 204
           C 244 190 252 178 256 164 Z"
        fill="url(#inner)"/>

  <!-- anvil -->
  <g>
    <!-- horn + body top -->
    <path d="M104 372
             C 132 356 160 352 196 352
             L 352 352
             C 374 352 388 358 396 368
             L 404 378
             C 392 384 378 386 360 386
             L 176 386
             C 146 386 122 382 104 372 Z"
          fill="url(#steel)"/>
    <!-- waist -->
    
    <path d="M214 386 L 330 386 L 318 418 L 226 418 Z" fill="#525b73"/>
    <!-- base -->
    <rect x="180" y="418" width="184" height="34" rx="10" fill="url(#steel)"/>
    <!-- highlight along the face -->
    <path d="M150 360 L 350 360" stroke="#c3cde6" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
  </g>

  </g>
</svg>